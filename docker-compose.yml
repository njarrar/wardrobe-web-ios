# Wardrobe on a Synology NAS (Container Manager → Project → Create), or any
# Docker host:  docker compose up -d --build
#
# 1. Create the folder /volume1/docker/wardrobe (File Station) and put this
#    project there, or point "build" at a published image instead.
# 2. Copy .env.example to .env and fill in ANTHROPIC_API_KEY and WARDROBE_TOKEN.
# 3. Open http://<NAS-IP>:4173 in a browser, or enter that address in the
#    iPhone app. See docs/synology.md for HTTPS and remote access.

services:
  wardrobe:
    build:
      context: .
      args:
        WITH_CUTOUT: "true"   # "false" = smaller image, no on-device background removal
    # Or use a prebuilt image (see .github/workflows/docker.yml):
    # image: ghcr.io/njarrar/wardrobe:latest
    container_name: wardrobe
    restart: unless-stopped
    ports:
      - "4173:4173"
    env_file:
      - .env
    environment:
      WARDROBE_HOST: 0.0.0.0
      WARDROBE_DATA_DIR: /data
      WARDROBE_MODEL_CACHE: /data/models
      # Owner of the files in ./data on the NAS. Run `id` over SSH to find
      # yours; the first DSM admin account is usually 1026:100.
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
      TZ: ${TZ:-Europe/London}
    volumes:
      # Everything lives here: library.json, outfits.json, photos, cutouts
      # and the downloaded model. Back up this folder (Hyper Backup/Snapshot).
      - ./data:/data
    # Background removal runs a small AI model on the NAS CPU. Cap its memory
    # on small units; 2 GB is comfortable, 1 GB works with WITH_CUTOUT=false.
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
