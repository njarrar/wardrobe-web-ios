name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Advisory check for high/critical runtime dependency vulnerabilities.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          SCREENSHOT_DIR: screenshots
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: phone-screenshots
          path: screenshots
          if-no-files-found: ignore

  # Builds the iOS app for the simulator, without signing, so a broken
  # Xcode project shows up on the pull request instead of at release time.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npx vite build && npx cap sync ios
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
      # Opens the built app in a simulator. Fails when the app does not
      # install, does not start, or quits within 20 seconds. Keeps a
      # picture of the first screen.
      - name: Open the app in a simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/Build/Products/Release-iphonesimulator/App.app
          xcrun simctl launch "$device" com.njarrar.wardrobe
          sleep 20
          xcrun simctl spawn "$device" launchctl list | grep com.njarrar.wardrobe
          mkdir -p simulator
          xcrun simctl io "$device" screenshot simulator/first-screen.png
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: simulator-first-screen
          path: simulator
          if-no-files-found: ignore

  # Builds the Android app (debug, unsigned) so a broken Gradle project
  # shows up on the pull request instead of at release time.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx vite build && npx cap sync android
      # Maven downloads fail now and then, so try once more.
      - run: ./gradlew assembleDebug || ./gradlew assembleDebug
        working-directory: android
